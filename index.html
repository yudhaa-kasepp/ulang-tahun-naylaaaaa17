<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yudha Project</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Poppins',sans-serif;
    background:url('https://image2url.com/r2/default/images/1771541100125-aa52af5d-a820-468a-98b6-c35cb733a869.jpeg') no-repeat center/cover;
    height:100vh;
    overflow:hidden;
    color:#fff;
}

body::before{
    content:'';
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    backdrop-filter:blur(10px);
}

/* INTRO */
#intro{
    position:fixed;
    width:100%;
    height:100vh;
    background:#020617;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:10;
    transition:1s;
}

.hide{opacity:0;pointer-events:none;}

.title{display:flex;font-size:36px;}

.yudha{opacity:0;animation:fadeIn 1.5s forwards;}

.project{
    margin-left:10px;
    transform:translateY(-200px);
    opacity:0;
    background:linear-gradient(90deg,#fff,#00eaff,#fff);
    background-size:200%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 0 15px #00eaff;
    animation:drop 1s forwards,shine 2s forwards;
    animation-delay:1s,2s;
}

@keyframes fadeIn{to{opacity:1;}}
@keyframes drop{to{transform:translateY(0);opacity:1;}}
@keyframes shine{from{background-position:-100%;}to{background-position:200%;}}

/* MAIN */
#main{
    position:fixed;
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    transition:1s;
}

#main.show{opacity:1;}

.card{
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    padding:3rem;
    border-radius:20px;
    text-align:center;
}

.btn{
    margin-top:20px;
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:#00eaff;
    cursor:pointer;
    box-shadow:0 0 10px rgba(0,234,255,0.5);
}

/* POPUP */
#popup{
    position:fixed;
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(10px);
    opacity:0;
    pointer-events:none;
    transition:0.3s;
}

#popup.active{opacity:1;pointer-events:auto;}

.popup-box{
    background:rgba(255,255,255,0.1);
    padding:2rem;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,234,255,0.3);
}

/* PIN DOTS */
.dots{
    display:flex;
    justify-content:center;
    margin:15px 0;
}

.dot{
    width:12px;
    height:12px;
    margin:0 6px;
    border-radius:50%;
    background:rgba(255,255,255,0.3);
}

.dot.active{
    background:#00eaff;
    box-shadow:0 0 10px #00eaff,0 0 20px #00eaff;
}

/* KEYPAD */
.keypad{
    display:grid;
    grid-template-columns:repeat(3,70px);
    gap:10px;
    justify-content:center;
}

.key{
    height:60px;
    border-radius:50%;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
    cursor:pointer;
}

.key:active{
    background:rgba(255,255,255,0.3);
    box-shadow:0 0 15px #00eaff;
    transform:scale(0.95);
}

/* SUCCESS */
.check{
    font-size:50px;
    color:#00eaff;
    text-shadow:0 0 20px #00eaff,0 0 40px #00eaff;
    animation:pop 0.5s ease;
}

/* ERROR */
.error{
    animation:shake 0.4s;
    border:1px solid red;
    box-shadow:0 0 15px red;
}

@keyframes shake{
    0%{transform:translateX(0);}
    25%{transform:translateX(-8px);}
    50%{transform:translateX(8px);}
    75%{transform:translateX(-8px);}
    100%{transform:translateX(0);}
}

@keyframes pop{
    0%{transform:scale(0.5);opacity:0;}
    100%{transform:scale(1);opacity:1;}
}
</style>
</head>
<body>

<!-- INTRO -->
<div id="intro">
    <div class="title">
        <span class="yudha">Yudha</span>
        <span class="project">Project</span>
    </div>
</div>

<!-- MAIN -->
<div id="main">
    <div class="card">
        <h2>Website Ditutup</h2>
        <p>Kenangan masih tersimpan dan akan selalu ada.</p>
        <button class="btn" onclick="openPopup()">Buka Kembali</button>
        <br><br>
        <span style="opacity:0.5;font-size:12px;">by Yudha</span>
    </div>
</div>

<!-- POPUP PIN -->
<div id="popup">
    <div class="popup-box">

        <h3>Masukkan PIN</h3>

        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="keypad">
            <div class="key" onclick="press(1)">1</div>
            <div class="key" onclick="press(2)">2</div>
            <div class="key" onclick="press(3)">3</div>
            <div class="key" onclick="press(4)">4</div>
            <div class="key" onclick="press(5)">5</div>
            <div class="key" onclick="press(6)">6</div>
            <div class="key" onclick="press(7)">7</div>
            <div class="key" onclick="press(8)">8</div>
            <div class="key" onclick="press(9)">9</div>
            <div></div>
            <div class="key" onclick="press(0)">0</div>
            <div class="key" onclick="resetPin()">⌫</div>
        </div>

    </div>
</div>

<script>
const PIN="1234";
let input="";

/* intro */
setTimeout(()=>{
    document.getElementById("intro").classList.add("hide");
    setTimeout(()=>{
        document.getElementById("main").classList.add("show");
    },500);
},3500);

/* popup */
function openPopup(){
    document.getElementById("popup").classList.add("active");
}

/* PIN logic */
function press(num){
    if(input.length<4){
        input+=num;
        updateDots();
    }

    if(input.length===4){
        checkPin();
    }
}

function updateDots(){
    let dots=document.querySelectorAll(".dot");
    dots.forEach((d,i)=>{
        d.classList.toggle("active",i<input.length);
    });
}

function resetPin(){
    input="";
    updateDots();
}

function checkPin(){
    let box=document.querySelector(".popup-box");

    if(input===PIN){

        box.innerHTML=`
            <div class="success">
                <div class="check">✔</div>
                <h3>Akses Diterima</h3>
                <p>Membuka kenangan...</p>
            </div>
        `;

        setTimeout(()=>{
            window.location.href="https://yudhaa-kasepp.github.io/Hbd-naylaaaa/";
        },1500);

    }else{
        box.classList.add("error");

        setTimeout(()=>{
            box.classList.remove("error");
            resetPin();
        },500);
    }
}
</script>

</body>
</html>
