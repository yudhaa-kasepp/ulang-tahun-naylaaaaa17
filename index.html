<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Ditutup</title>
    
    <!-- Font Google: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* Reset CSS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            /* Background gelap aesthetic */
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow: hidden;
        }

        /* Kartu Utama */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 3rem 2rem;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            
            /* Animasi Fade In */
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1.2s ease-out forwards;
        }

        /* Icon Wifi Silang */
        .wifi-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            display: block;
            animation: pulse 2s infinite;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            letter-spacing: 1px;
            color: #e0e0e0;
        }

        p {
            font-size: 0.95rem;
            font-weight: 300;
            line-height: 1.6;
            color: #b0b0b0;
            margin-bottom: 0.5rem;
        }

        /* Teks Highlight */
        .highlight {
            font-weight: 600;
            color: #ffffff;
            font-size: 1.1rem;
            margin-top: 1rem;
            display: block;
        }

        /* Animasi */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.05);
            }
        }

        /* Responsif HP */
        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.5rem;
            }
            h1 {
                font-size: 1.3rem;
            }
            p {
                font-size: 0.85rem;
            }
            .wifi-icon {
                font-size: 4rem;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Icon Wifi Silang -->
        <span class="wifi-icon">📶❌</span>
        
        <h1>Website Ditutup</h1>
        
        <p>
            Website ini telah ditutup oleh Yudha, tapi tenang kenangan ini masih disimpan oleh Yudha dan suatu hari bisa ditampilkan kembali.
        </p>
        
        <span class="highlight">
            Yuda selalu ada 🤍
        </span>
    </div>

</body>
</html>
